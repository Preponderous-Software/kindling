name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  USD_RECORDER_REF: 1aae66d  # the usd-recorder commit the restore prototype was written against

jobs:
  test:
    name: Prototypes and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hearth scene generator is deterministic
        working-directory: prototypes/hearth-scene
        run: |
          for mode in after before; do
            arg=$([ "$mode" = before ] && echo before || true)
            python gen_hearth.py $arg > a.scene
            python gen_hearth.py $arg > b.scene
            cmp a.scene b.scene
            grep -q '^camera ' a.scene
            echo "$mode: $(wc -l < a.scene) lines"
          done

      - name: Fetch usd-recorder
        run: |
          git clone --quiet https://github.com/Preponderous-Software/usd-recorder "$RUNNER_TEMP/usd-recorder"
          git -C "$RUNNER_TEMP/usd-recorder" checkout --quiet "$USD_RECORDER_REF"

      - name: Build and run the restore prototype twice
        working-directory: prototypes/restore-replay
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I "$RUNNER_TEMP/usd-recorder/cpp/include" restore.cpp -o restore
          ./restore a.usda
          ./restore b.usda
          cmp a.usda b.usda

      - name: Replay conforms to usd-replay/1
        working-directory: prototypes/restore-replay
        run: |
          python -m pip install --quiet numpy usd-core "$RUNNER_TEMP/usd-recorder"
          usd-recorder replay validate a.usda

      - name: Relative links in Markdown resolve
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              for target in re.findall(r"\]\(([^)\s]+)\)", md.read_text(encoding="utf-8")):
                  if re.match(r"[a-z]+:", target) or target.startswith("#"):
                      continue
                  path = (md.parent / target.split("#")[0]).resolve()
                  if not path.exists():
                      bad.append(f"{md}: {target}")
          print("\n".join(bad) or "all relative links resolve")
          sys.exit(1 if bad else 0)
          PY

  sim:
    name: Rules and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation and tests (no engine)
        run: |
          cmake -S . -B build -DKINDLING_WITH_STRATA=OFF -DKINDLING_WARNINGS_AS_ERRORS=ON
          cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  game-linux:
    name: Game (Linux, headless tour and autopilot)
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libegl-dev libgl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Build the game on Strata
        run: |
          cmake -S . -B build -DKINDLING_WARNINGS_AS_ERRORS=ON -DKINDLING_BUILD_TESTS=OFF
          cmake --build build -j4 --target kindling
      - name: Headless tour
        run: |
          mkdir -p tour
          ./build/kindling --headless --tour --frames tour
          test "$(ls tour/*.png | wc -l)" -ge 6
      - name: Autopilot plays the whole restoration
        run: |
          mkdir -p frames reveal
          ./build/kindling --headless --autopilot --frames frames --frame-every 1500 --reveal-frames reveal \
            --replay restoration.usda --width 640 --height 360
          test -s restoration.usda
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The restoration's replay conforms to usd-replay/1
        run: |
          git clone --quiet https://github.com/Preponderous-Software/usd-recorder "$RUNNER_TEMP/usd-recorder"
          git -C "$RUNNER_TEMP/usd-recorder" checkout --quiet "$USD_RECORDER_REF"
          python -m pip install --quiet numpy usd-core "$RUNNER_TEMP/usd-recorder"
          usd-recorder replay validate restoration.usda
      - uses: actions/upload-artifact@v4
        with:
          name: tour-linux
          path: |
            tour/
            frames/
            reveal/reveal-0000.png
            reveal/reveal-0100.png
            reveal/reveal-0200.png
            reveal/reveal-0300.png

  game-windows:
    name: Game (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DKINDLING_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
